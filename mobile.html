    lastTap=now;
  });
  B.addEventListener('dblclick',e=>{ if(sc>1){sc=1;tx=0;ty=0;}else{sc=2.5;tx=e.clientX*(1-sc);ty=e.clientY*(1-sc);clamp();} apply(); });
  B.addEventListener('wheel',e=>{ if(!e.ctrlKey)return; e.preventDefault();
    sc=Math.min(5,Math.max(1,sc*(e.deltaY<0?1.12:0.9))); if(sc===1){tx=0;ty=0;} clamp(); apply();
  },{passive:false});
})();
<\/script>`;
const TK_REG=[];
function confRow(k,v){ return v?('<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'):''; }
function openTicketData(e, idx){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const r=TK_REG[idx]; if(!r) return false;
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let rows='', note='';
  if(r.kind==='flight'){
    rows=confRow('Booking ref','<b>'+esc(r.src.ref)+'</b>')+confRow('Passengers',esc(r.src.pax||'3'))
      +confRow('Outbound','Sat 5 Sep 2026 · MEL → CDG (via SIN)')+confRow('Return','Sun 11 Oct 2026 · MXP → MEL (via SIN)')
      +confRow('Cabin',esc(r.src.cabin))+confRow('Paid',esc(r.src.cost));
    note='Manage seats, meals (incl. gluten-free) and check-in via the Singapore Airlines app with the reference above.';
  }else if(r.kind==='leg'){
    const t=(typeof TRANSFERS!=='undefined'?TRANSFERS:[]).find(x=>x.detail&&r.src.ref&&x.detail.includes(r.src.ref));
    rows=confRow('Route',esc(r.src.from)+' → '+esc(r.src.to))+confRow('Date',esc(fmtISOd(r.src.date)))
      +confRow('Departs',esc(r.src.dep))+confRow('Arrives',esc(r.src.arr))
      +confRow('Reference','<b>'+esc(r.src.ref)+'</b>')+confRow('Mode',esc(r.src.mode));
    note=t?esc(t.detail):'';
  }else if(r.kind==='stay'){
    const s=r.src, b=s.booking||{};
    rows=confRow('Property',esc(b.name))+confRow('City',esc(s.city))+confRow('Stay',esc(fmtRange(s.in,s.out)))
      +confRow('Reference','<b>'+esc(b.ref)+'</b>')+confRow('Platform',esc(b.plat))
      +confRow('Address',esc(b.addr))+confRow('Cost',esc(b.cost))+confRow('Payment',esc(b.pay));
    note=esc(b.note||'');
  }else if(r.kind==='transfer'){
    rows=confRow('Transfer',esc(r.src.title||r.src.name))+confRow('Date',esc(r.src.when||fmtISOd(r.src.date)))
      +confRow('Reference','<b>'+esc(r.src.ref)+'</b>')+confRow('Cost',esc(r.src.cost));
    note=esc(r.src.detail||'');
  }
  const qr=r.src.ref?('<div style="background:#fff;border-radius:14px;padding:14px;width:fit-content;margin:16px auto 4px">'+ticketQR(String(r.src.ref).split('·')[0].trim())+'</div>'):'';
  const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<style>body{margin:0;background:#0c0a14;color:#f5efe6;font-family:-apple-system,Inter,sans-serif;padding:20px 16px 46px}'
    +'h1{font-size:19px;margin:0 0 14px;color:#e8b974}.card{border:1px solid rgba(245,239,230,.14);border-radius:14px;padding:6px 14px;background:rgba(255,255,255,.02)}'
    +'.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(245,239,230,.07);font-size:14px}.kv:last-child{border-bottom:none}'
    +'.k{color:rgba(245,239,230,.5);flex-shrink:0}.v{text-align:right}'
    +'.note{font-size:13px;line-height:1.55;color:rgba(245,239,230,.75);margin-top:14px}</style></head>'
    +'<body><h1>'+esc(r.title)+'</h1><div class="card">'+rows+'</div>'+(note?'<div class="note">'+note+'</div>':'')+qr+TK_ZOOM+'</body></html>';
  const frame=ticketOverlay(r.title);
  frame.srcdoc=doc;
  return false;
}
async function ensureUnlock(){
  try{
    const p=localStorage.getItem('e26_pass');
    if(p){ await e26Decrypt(ENC_DATA,p); E26PASS=p; return; }
  }catch(_){}
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.id='lockGate';
    ov.innerHTML='<div class="gate-card"><div class="gate-logo">\uD83D\uDD12</div>'+
      '<div class="gate-title">Europe 2026</div>'+
      '<div class="gate-sub">Enter the trip passphrase to unlock</div>'+
      '<input type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Trip passphrase">'+
      '<div class="gate-err">Wrong passphrase \u2014 try again</div>'+
      '<button class="gate-btn">Unlock</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('input'), btn=ov.querySelector('.gate-btn'), err=ov.querySelector('.gate-err');
    const go=async()=>{
      const p=inp.value.trim(); if(!p) return;
      btn.disabled=true; btn.textContent='Unlocking\u2026'; err.style.display='none';
      try{
        await e26Decrypt(ENC_DATA,p);
        E26PASS=p; try{ localStorage.setItem('e26_pass',p); }catch(_){}
        ov.remove(); res();
      }catch(_){
        err.style.display='block'; btn.disabled=false; btn.textContent='Unlock'; inp.select();
      }
    };
    btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    setTimeout(()=>inp.focus(),80);
  });
}

async function loadData(opts){
  opts = opts || {};
  let usedCache = false;
  function applyData(d){
    if(d.stops)      STOPS     = d.stops;
    if(d.flights)    FLIGHTS   = d.flights;
    if(d.transfers)  TRANSFERS = d.transfers;
    if(d.legs)       LEGS      = d.legs;
    if(d.activities) ACTS      = d.activities.filter(a=>a.status==='booked');
    if(d.actions)    ACTIONS   = d.actions.map(a=>({ ...a, when: a.when ? new Date(a.when) : a.when, due: a.due ? new Date(a.due) : null }));
    setTimeout(()=>{ try{ precacheMiniMaps(); }catch(e){} }, 4000);
  }
  try{
    // Cache-bust so Home Screen icons never show a stale snapshot
    const res = await fetch('data.enc?v=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob = await res.json();
    const d = JSON.parse(await e26Decrypt(blob, E26PASS));
    applyData(d);
    window.__dataMeta = d._meta || null;
    // Stash the last-good copy (device-local) so the itinerary works with no signal
    try{ localStorage.setItem('europe2026_data', JSON.stringify(d)); }catch(e){}
  }catch(e){
    // No signal / fetch failed — try the last-good cached copy, then the built-in encrypted fallback
    let cached = null;
    try{ const raw = localStorage.getItem('europe2026_data'); if(raw) cached = JSON.parse(raw); }catch(e2){}
    if(cached){
      applyData(cached);
      window.__dataMeta = Object.assign({}, cached._meta || {}, { cached:true });
      usedCache = true;
      console.warn('Offline — using cached data from last sync');
    }else{
      try{
        const d = JSON.parse(await e26Decrypt(ENC_DATA, E26PASS));
        applyData(d);
        window.__dataMeta = Object.assign({}, d._meta || {}, { fallback:true });
        console.warn('Using built-in encrypted data (data.enc & cache not available):', e.message);
      }catch(e3){ window.__dataMeta = { fallback:true }; }
    }
  }
  buildAll();
  showUpdatedStamp();
  if(opts.toast) toast(usedCache ? 'Offline — showing last sync' : 'Updated ✓');
  // Pre-fetch mini-map tiles in the background so maps work offline later
  setTimeout(precacheMiniMaps, 4000);
}

function showUpdatedStamp(){
  const m = window.__dataMeta;
  let el = document.getElementById('updateStamp');
  if(!el){
    el = document.createElement('button');
    el.id = 'updateStamp';
    el.onclick = ()=>loadData({toast:true});
    document.body.appendChild(el);
  }
  let label = '↻ Refresh';
  if(m && m.cached){
    const dt = m.lastUpdated ? new Date(m.lastUpdated) : null;
    label = dt ? ('⚠ Offline · synced ' + dt.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})) : '⚠ Offline · cached copy';
  } else if(m && m.lastUpdated){
    const dt = new Date(m.lastUpdated);
    const opts = { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' };
    label = '↻ Updated ' + dt.toLocaleString('en-AU', opts);
  } else if(m && m.fallback){
    label = '↻ Refresh (offline copy)';
  }
  el.textContent = label + ' · build ' + BUILD;
}

(async()=>{ await ensureUnlock(); loadData(); })();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {

    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
