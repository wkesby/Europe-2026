/* ============ Passphrase gate + WebCrypto decryption ============ */
function e26b(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function e26Key(pass, salt){
  const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function e26DecryptRaw(blob, pass){
  const key=await e26Key(pass, e26b(blob.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:e26b(blob.iv)},key,e26b(blob.ct));
  return new Uint8Array(pt);
}
async function e26Decrypt(blob, pass){
  return new TextDecoder().decode(await e26DecryptRaw(blob, pass));
}
let E26PASS=null;
const RB_MON={Aug:8,Sep:9,Oct:10,Nov:11};
function rbDate(x){ // ISO 'YYYY-MM-DD' or label 'Sun 27 Sep' → 'MM-DD'
  if(!x) return null;
  const s=String(x);
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[2]+'-'+m[3];
  m=s.match(/(\d{1,2})\s+(Aug|Sep|Oct|Nov)/);
  if(m) return String(RB_MON[m[2]]).padStart(2,'0')+'-'+String(parseInt(m[1])).padStart(2,'0');
  return null;
}
function rbTime(...srcs){
  for(const s of srcs){ const m=String(s||'').match(/(\d{1,2}):(\d{2})/); if(m) return parseInt(m[1])*60+parseInt(m[2]); }
  return null;
}
function travelDays(){
  const set=new Map(); // 'MM-DD' → label
  (typeof LEGS!=='undefined'?LEGS:[]).forEach(l=>{ const k=rbDate(l.date); if(k) set.set(k, fmtISOd(l.date)); });
  (typeof TRANSFERS!=='undefined'?TRANSFERS:[]).forEach(t=>{ const k=rbDate(t.date||t.when); if(k&&!set.has(k)) set.set(k, String(t.date||t.when).split('·')[0].trim()); });
  return [...set.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
}
function runbookDoc(key){
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const hops=[];
  (typeof TRANSFERS!=='undefined'?TRANSFERS:[]).forEach((t,i)=>{
    if(rbDate(t.date||t.when)!==key) return;
    hops.push({t:rbTime(t.when,t.detail), kind:'Transfer', title:t.title||t.name||'Transfer',
      ref:t.ref, detail:t.detail, phone:(String(t.detail||'').match(/\+\d[\d\s]{8,15}/)||[])[0], link:t.link});
  });
  (typeof LEGS!=='undefined'?LEGS:[]).forEach(l=>{
    if(rbDate(l.date)!==key) return;
    hops.push({t:rbTime(l.dep), kind:l.mode||'Leg', title:l.from+' → '+l.to,
      ref:l.ref, dep:l.dep, arr:l.arr, arrMin:rbTime(l.arr), tkt:l.tkt, link:l.link});
  });
  hops.sort((a,b)=>(a.t==null?9999:a.t)-(b.t==null?9999:b.t));
  let label=key; const td=travelDays().find(x=>x[0]===key); if(td) label=td[1];
  let rows='';
  hops.forEach((h,i)=>{
    // buffer vs previous hop with a known end time
    if(i>0){
      const prev=hops[i-1];
      const prevEnd=prev.arrMin!=null?prev.arrMin:null;
      if(prevEnd!=null && h.t!=null){
        const gap=h.t-prevEnd;
        if(gap>0 && gap<600){
          const cls=gap<25?'vt':gap<45?'tt':'ok';
          const g=gap>=60?Math.floor(gap/60)+'h '+(gap%60)+'m':gap+' min';
          rows+='<div class="buf '+cls+'">'+(cls==='vt'?'⚠ ':'')+g+' buffer'+(cls==='vt'?' — very tight':cls==='tt'?' — keep moving':'')+'</div>';
        }
      }
    }
    const tm=h.t!=null?String(Math.floor(h.t/60)).padStart(2,'0')+':'+String(h.t%60).padStart(2,'0'):'—';
    rows+='<div class="hop"><div class="hop-t">'+tm+'</div><div class="hop-b">'
      +'<div class="hop-h">'+esc(h.title)+(h.arr?' <span class="arr">arr '+esc(h.arr)+'</span>':'')+'</div>'
      +(h.ref?'<div class="hop-r">Ref <b>'+esc(h.ref)+'</b></div>':'')
      +(h.detail?'<div class="hop-d">'+esc(h.detail)+'</div>':'')
      +(h.phone?'<a class="hop-a" href="tel:'+h.phone.replace(/\s/g,'')+'">☎ '+esc(h.phone)+'</a>':'')
      +'</div></div>';
  });
  if(!rows) rows='<div class="hop-d">No legs or transfers on this date.</div>';
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<style>body{margin:0;background:#0c0a14;color:#f5efe6;font-family:-apple-system,Inter,sans-serif;padding:20px 16px 46px}'
    +'h1{font-size:19px;margin:0 0 3px;color:#e8b974}.sub{font-size:13px;color:rgba(245,239,230,.55);margin-bottom:14px}'
    +'.hop{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(245,239,230,.08)}'
    +'.hop-t{font-size:16px;font-weight:800;color:#e8b974;min-width:52px}'
    +'.hop-h{font-size:15px;font-weight:700}.arr{font-weight:400;font-size:12.5px;color:rgba(245,239,230,.55)}'
    +'.hop-r{font-size:13px;margin-top:2px}.hop-d{font-size:12.5px;line-height:1.5;color:rgba(245,239,230,.65);margin-top:4px}'
    +'.hop-a{display:inline-block;margin-top:6px;color:#e8b974;text-decoration:none;border:1px solid rgba(232,183,116,.4);border-radius:9px;padding:6px 10px;font-size:13px}'
    +'.buf{margin:6px 0 6px 64px;font-size:12.5px;border-radius:9px;padding:6px 10px;width:fit-content}'
    +'.buf.ok{background:rgba(143,212,154,.1);color:#8fd49a}.buf.tt{background:rgba(232,183,116,.12);color:#e8b974}.buf.vt{background:rgba(232,131,111,.15);color:#e8836f;font-weight:700}'
    +'</style></head><body><h1>Travel day — '+esc(label)+'</h1>'
    +'<div class="sub">Every hop in order · refs, calls and buffers on one screen</div>'+rows+'</body></html>';
}
function openRunbook(e,key,label){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const frame=ticketOverlay('Travel day — '+(label||key));
  frame.src=URL.createObjectURL(new Blob([runbookDoc(key)],{type:'text/html'}));
  return false;
}
function ticketOverlay(title){
  let ov=document.getElementById('tkOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='tkOverlay';
    ov.innerHTML='<div class="tko-bar"><button class="tko-back">‹ Back</button><div class="tko-title"></div></div><iframe class="tko-frame" title="Ticket"></iframe>';
    document.body.appendChild(ov);
    ov.querySelector('.tko-back').onclick=()=>{
      ov.classList.remove('open');
      const f=ov.querySelector('.tko-frame');
      f.removeAttribute('srcdoc'); f.src='about:blank';
    };
  }
  ov.querySelector('.tko-title').textContent=title||'Ticket';
  ov.classList.add('open');
  return ov.querySelector('.tko-frame');
}
async function openTicket(e, path, title){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const frame=ticketOverlay(title||'Ticket');
  try{
    let res=null; try{ res=await fetch(path+'?v='+Date.now(),{cache:'no-store'}); }catch(_){}
    if(!res || !res.ok) res=await fetch(path); // service-worker cache when offline
    const blob=await res.json();
    const bytes=await e26DecryptRaw(blob, E26PASS);
    frame.src=URL.createObjectURL(new Blob([bytes],{type:blob.mime||'text/html'}));
  }catch(err){
    document.getElementById('tkOverlay').classList.remove('open');
    toast("Couldn't open the ticket — check connection and retry");
  }
  return false;
}
async function downloadTicketPdf(path, filename){
  try{
    let res=null; try{ res=await fetch(path+'?v='+Date.now(),{cache:'no-store'}); }catch(_){}
    if(!res || !res.ok) res=await fetch(path);
    const blob=await res.json();
    const bytes=await e26DecryptRaw(blob, E26PASS||localStorage.getItem('e26_pass'));
    const u=URL.createObjectURL(new Blob([bytes],{type:blob.mime||'application/pdf'}));
    const a=document.createElement('a'); a.href=u; a.download=filename||'ticket.pdf';
    document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500);
  }catch(e){ toast("Couldn't fetch the PDF — check connection"); }
}
const TK_ZOOM=`<script>/* pinch + double-tap zoom (self-contained; works inside iframes) */
(function(){
  const B=document.body;
  const wrap=document.createElement('div'); wrap.id='zw';
  while(B.firstChild) wrap.appendChild(B.firstChild);
  B.appendChild(wrap); B.style.overflow='hidden'; B.style.height='100vh';
  wrap.style.cssText='transform-origin:0 0;width:100%;min-height:100vh;overflow-y:auto;height:100vh;-webkit-overflow-scrolling:touch;padding:0';
  let sc=1,tx=0,ty=0,p0=null,pan=null;
  const apply=()=>{wrap.style.transform=\`translate(\${tx}px,\${ty}px) scale(\${sc})\`;
    wrap.style.height=sc>1?'auto':'100vh'; B.style.touchAction=sc>1?'none':'auto';};
  const clamp=()=>{const w=innerWidth,h=innerHeight;
    tx=Math.min(0,Math.max(w-w*sc,tx)); ty=Math.min(0,Math.max(h-h*sc,ty));};
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  B.addEventListener('touchstart',e=>{
    if(e.touches.length===2){e.preventDefault();p0={d:dist(e.touches),m:mid(e.touches),sc,tx,ty};}
    else if(e.touches.length===1&&sc>1){pan={x:e.touches[0].clientX,y:e.touches[0].clientY,tx,ty};}
  },{passive:false});
  B.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&p0){e.preventDefault();
      const k=dist(e.touches)/p0.d, m=mid(e.touches);
      sc=Math.min(5,Math.max(1,p0.sc*k));
      tx=m.x-(p0.m.x-p0.tx)*(sc/p0.sc); ty=m.y-(p0.m.y-p0.ty)*(sc/p0.sc);
      clamp(); apply();
    }else if(e.touches.length===1&&pan&&sc>1){e.preventDefault();
      tx=pan.tx+(e.touches[0].clientX-pan.x); ty=pan.ty+(e.touches[0].clientY-pan.y);
      clamp(); apply();
    }
  },{passive:false});
  B.addEventListener('touchend',()=>{p0=null;pan=null; if(sc<1.02){sc=1;tx=0;ty=0;apply();}});
  let lastTap=0;
  B.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTap<300&&e.changedTouches.length===1){
      const t=e.changedTouches[0];
      if(sc>1){sc=1;tx=0;ty=0;}
      else{sc=2.5;tx=t.clientX-(t.clientX)*sc;ty=t.clientY-(t.clientY)*sc;clamp();}
      apply();
    }
    lastTap=now;
  });
  B.addEventListener('dblclick',e=>{ if(sc>1){sc=1;tx=0;ty=0;}else{sc=2.5;tx=e.clientX*(1-sc);ty=e.clientY*(1-sc);clamp();} apply(); });
  B.addEventListener('wheel',e=>{ if(!e.ctrlKey)return; e.preventDefault();
    sc=Math.min(5,Math.max(1,sc*(e.deltaY<0?1.12:0.9))); if(sc===1){tx=0;ty=0;} clamp(); apply();
  },{passive:false});
})();
<\/script>`;
const TK_REG=[];
function confRow(k,v){ return v?('<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'):''; }
function openTicketData(e, idx){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  const r=TK_REG[idx]; if(!r) return false;
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let rows='', note='';
  if(r.kind==='flight'){
    rows=confRow('Booking ref','<b>'+esc(r.src.ref)+'</b>')+confRow('Passengers',esc(r.src.pax||'3'))
      +confRow('Outbound','Sat 5 Sep 2026 · MEL → CDG (via SIN)')+confRow('Return','Sun 11 Oct 2026 · MXP → MEL (via SIN)')
      +confRow('Cabin',esc(r.src.cabin))+confRow('Paid',esc(r.src.cost));
    note='Manage seats, meals (incl. gluten-free) and check-in via the Singapore Airlines app with the reference above.';
  }else if(r.kind==='leg'){
    const t=(typeof TRANSFERS!=='undefined'?TRANSFERS:[]).find(x=>x.detail&&r.src.ref&&x.detail.includes(r.src.ref));
    rows=confRow('Route',esc(r.src.from)+' → '+esc(r.src.to))+confRow('Date',esc(fmtISOd(r.src.date)))
      +confRow('Departs',esc(r.src.dep))+confRow('Arrives',esc(r.src.arr))
      +confRow('Reference','<b>'+esc(r.src.ref)+'</b>')+confRow('Mode',esc(r.src.mode));
    note=t?esc(t.detail):'';
  }else if(r.kind==='stay'){
    const s=r.src, b=s.booking||{};
    rows=confRow('Property',esc(b.name))+confRow('City',esc(s.city))+confRow('Stay',esc(fmtRange(s.in,s.out)))
      +confRow('Reference','<b>'+esc(b.ref)+'</b>')+confRow('Platform',esc(b.plat))
      +confRow('Address',esc(b.addr))+confRow('Cost',esc(b.cost))+confRow('Payment',esc(b.pay));
    note=esc(b.note||'');
  }else if(r.kind==='transfer'){
    rows=confRow('Transfer',esc(r.src.title||r.src.name))+confRow('Date',esc(r.src.when||fmtISOd(r.src.date)))
      +confRow('Reference','<b>'+esc(r.src.ref)+'</b>')+confRow('Cost',esc(r.src.cost));
    note=esc(r.src.detail||'');
  }
  const qr=r.src.ref?('<div style="background:#fff;border-radius:14px;padding:14px;width:fit-content;margin:16px auto 4px">'+ticketQR(String(r.src.ref).split('·')[0].trim())+'</div>'):'';
  const doc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<style>body{margin:0;background:#0c0a14;color:#f5efe6;font-family:-apple-system,Inter,sans-serif;padding:20px 16px 46px}'
    +'h1{font-size:19px;margin:0 0 14px;color:#e8b974}.card{border:1px solid rgba(245,239,230,.14);border-radius:14px;padding:6px 14px;background:rgba(255,255,255,.02)}'
    +'.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(245,239,230,.07);font-size:14px}.kv:last-child{border-bottom:none}'
    +'.k{color:rgba(245,239,230,.5);flex-shrink:0}.v{text-align:right}'
    +'.note{font-size:13px;line-height:1.55;color:rgba(245,239,230,.75);margin-top:14px}</style></head>'
    +'<body><h1>'+esc(r.title)+'</h1><div class="card">'+rows+'</div>'+(note?'<div class="note">'+note+'</div>':'')+qr+TK_ZOOM+'</body></html>';
  const frame=ticketOverlay(r.title);
  frame.srcdoc=doc;
  return false;
}
async function ensureUnlock(){
  try{
    const p=localStorage.getItem('e26_pass');
    if(p){ await e26Decrypt(ENC_DATA,p); E26PASS=p; return; }
  }catch(_){}
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.id='lockGate';
    ov.innerHTML='<div class="gate-card"><div class="gate-logo">\uD83D\uDD12</div>'+
      '<div class="gate-title">Europe 2026</div>'+
      '<div class="gate-sub">Enter the trip passphrase to unlock</div>'+
      '<input type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Trip passphrase">'+
      '<div class="gate-err">Wrong passphrase \u2014 try again</div>'+
      '<button class="gate-btn">Unlock</button></div>';
    document.body.appendChild(ov);
    const inp=ov.querySelector('input'), btn=ov.querySelector('.gate-btn'), err=ov.querySelector('.gate-err');
    const go=async()=>{
      const p=inp.value.trim(); if(!p) return;
      btn.disabled=true; btn.textContent='Unlocking\u2026'; err.style.display='none';
      try{
        await e26Decrypt(ENC_DATA,p);
        E26PASS=p; try{ localStorage.setItem('e26_pass',p); }catch(_){}
        ov.remove(); res();
      }catch(_){
        err.style.display='block'; btn.disabled=false; btn.textContent='Unlock'; inp.select();
      }
    };
    btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    setTimeout(()=>inp.focus(),80);
  });
}

async function loadData(opts){
  opts = opts || {};
  let usedCache = false;
  function applyData(d){
    if(d.stops)      STOPS     = d.stops;
    if(d.flights)    FLIGHTS   = d.flights;
    if(d.transfers)  TRANSFERS = d.transfers;
    if(d.legs)       LEGS      = d.legs;
    if(d.activities) ACTS      = d.activities.filter(a=>a.status==='booked');
    if(d.actions)    ACTIONS   = d.actions.map(a=>({ ...a, when: a.when ? new Date(a.when) : a.when, due: a.due ? new Date(a.due) : null }));
    setTimeout(()=>{ try{ precacheMiniMaps(); }catch(e){} }, 4000);
  }
  try{
    // Cache-bust so Home Screen icons never show a stale snapshot
    const res = await fetch('data.enc?v=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob = await res.json();
    const d = JSON.parse(await e26Decrypt(blob, E26PASS));
    applyData(d);
    window.__dataMeta = d._meta || null;
    // Stash the last-good copy (device-local) so the itinerary works with no signal
    try{ localStorage.setItem('europe2026_data', JSON.stringify(d)); }catch(e){}
  }catch(e){
    // No signal / fetch failed — try the last-good cached copy, then the built-in encrypted fallback
    let cached = null;
    try{ const raw = localStorage.getItem('europe2026_data'); if(raw) cached = JSON.parse(raw); }catch(e2){}
    if(cached){
      applyData(cached);
      window.__dataMeta = Object.assign({}, cached._meta || {}, { cached:true });
      usedCache = true;
      console.warn('Offline — using cached data from last sync');
    }else{
      try{
        const d = JSON.parse(await e26Decrypt(ENC_DATA, E26PASS));
        applyData(d);
        window.__dataMeta = Object.assign({}, d._meta || {}, { fallback:true });
        console.warn('Using built-in encrypted data (data.enc & cache not available):', e.message);
      }catch(e3){ window.__dataMeta = { fallback:true }; }
    }
  }
  buildAll();
  showUpdatedStamp();
  if(opts.toast) toast(usedCache ? 'Offline — showing last sync' : 'Updated ✓');
  // Pre-fetch mini-map tiles in the background so maps work offline later
  setTimeout(precacheMiniMaps, 4000);
}

function showUpdatedStamp(){
  const m = window.__dataMeta;
  let el = document.getElementById('updateStamp');
  if(!el){
    el = document.createElement('button');
    el.id = 'updateStamp';
    el.onclick = ()=>loadData({toast:true});
    document.body.appendChild(el);
  }
  let label = '↻ Refresh';
  if(m && m.cached){
    const dt = m.lastUpdated ? new Date(m.lastUpdated) : null;
    label = dt ? ('⚠ Offline · synced ' + dt.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})) : '⚠ Offline · cached copy';
  } else if(m && m.lastUpdated){
    const dt = new Date(m.lastUpdated);
    const opts = { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' };
    label = '↻ Updated ' + dt.toLocaleString('en-AU', opts);
  } else if(m && m.fallback){
    label = '↻ Refresh (offline copy)';
  }
  el.textContent = label + ' · build ' + BUILD;
}
